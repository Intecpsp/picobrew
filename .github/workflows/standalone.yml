name: Standalone firmware and browser

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: firmware/pico-s-pro/modified

jobs:
  usb-tools:
    name: USB tools / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress
      - name: Install pinned USB tool dependencies
        run: python -m pip install -r requirements-usb.txt
      - name: Read-only protocol, receive-queue and offline-inspection simulations
        run: make usb-test PYTHON=python

  host-and-browser:
    name: Firmware simulations / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress
      - name: Native compiler and portable build tools
        run: make tooling-test PYTHON=python
      - name: Install browser test dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements-web-test.txt
          python -m playwright install --with-deps chromium
      - name: Portable firmware tests
        run: make standalone-test PYTHON=python
      - name: Browser against the real portable C API
        if: runner.os == 'Linux'
        run: make web-test PYTHON=python
      - name: Preserve browser previews
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-previews-${{ matrix.os }}
          path: firmware/pico-s-pro/modified/build/web-preview/*.png
          if-no-files-found: ignore

  arm-firmware:
    name: ARM builds and preserved archives / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The pinned vendor compiler is Intel on macOS. Native Apple Silicon
        # Hub and host simulations are covered above and in server.yml.
        os: [ubuntu-latest, macos-26-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Bootstrap pinned compiler and Energia SDK
        run: make bootstrap PYTHON=python
      - name: Link appliance image and verify native flash recovery
        run: make standalone-storage-test PYTHON=python
      - name: Verify the committed installation package matches the build
        run: python tools/verify_firmware_package.py
      - name: Verify ARM interrupt and filter-trip guards
        run: make standalone-arm-test PYTHON=python
      - name: Verify SDK pin tables
        run: make pin-check PYTHON=python
      - name: Reproduce preserved OEM and recovery images without changing their sources
        working-directory: .
        run: |
          make oem PYTHON=python
          make recovery PYTHON=python
          python tools/verify_firmware_import.py
      - name: Preserve firmware candidate and image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-firmware-candidate-${{ matrix.os }}
          include-hidden-files: true
          path: |
            firmware/pico-s-pro/modified/build/standalone/firmware/pico-s-pro-standalone.bin
            firmware/pico-s-pro/modified/build/standalone/firmware/pico-s-pro-standalone.elf
            firmware/pico-s-pro/modified/build/standalone/firmware/pico-s-pro-standalone.map
            firmware/pico-s-pro/modified/build/standalone/firmware/firmware-report.json
            firmware/pico-s-pro/modified/firmware/web/
            firmware/pico-s-pro/modified/.deps/toolchain/.picobrew-target-runtime.json
            build/archives/oem/portable-build.json
            build/archives/recovery/portable-build.json
