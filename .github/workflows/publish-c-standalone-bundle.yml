name: Package verified Pico C Hub website
on:
  push:
    branches: [feature/pico-c-standalone]
    paths: [.github/workflows/publish-c-standalone-bundle.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Require the triggering revision
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - name: Rebuild the reviewed website sources
        run: |
          npm --prefix server/web ci --engine-strict
          npm --prefix server/web run build:bundle
      - name: Verify exact bytes and publish the generated bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object server/internal/webui/bundle.zip)" = b80d11dfcb39c72fda59440dddeb6c4feeb0a766
          test "$(git hash-object server/internal/webui/manifest.json)" = fa62d1d601032985ac42f7b1564549e4511ea3d3
          git add server/internal/webui/bundle.zip server/internal/webui/manifest.json
          git rm .github/workflows/publish-c-standalone-bundle.yml
          test "$(git write-tree)" = 1630d104a90e86ed1bac8648ae9ab420c0162ecf
          git restore --source=HEAD --staged --worktree .github/workflows/publish-c-standalone-bundle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Package the verified Pico C Hub website'
          gh auth setup-git
          git push origin HEAD:refs/heads/feature/pico-c-standalone
