name: Pico C standalone firmware

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: firmware/pico-c/modified

jobs:
  host-and-browser:
    name: C standalone simulations and browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install -r requirements-test.txt -r requirements-web-test.txt
          python -m playwright install --with-deps chromium
      - name: Test C API, storage, network, model guards and both display control paths
        run: |
          make standalone-test PYTHON=python
          make tooling-test PYTHON=python
      - name: Test desktop and mobile against the actual portable C API
        run: make web-test PYTHON=python
      - name: Preserve C browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pico-c-browser-previews
          path: firmware/pico-c/modified/build/web-preview/*.png
          if-no-files-found: ignore

  native-firmware:
    name: C native ARM / ${{ matrix.display }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        display: [ssd1325, ssd1309]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned emulator dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Bootstrap pinned compiler and SDK
        run: make bootstrap PYTHON=python
      - name: Link C-specific hardware application and execute native storage boundary tests
        run: make standalone-storage-test MODEL=pico-c DISPLAY_VARIANT=${{ matrix.display }} PYTHON=python
      - name: Verify published image and package model/controller guards
        run: |
          python tools/verify_firmware_package.py --model pico-c --display ${{ matrix.display }}
          python tools/package_hub_firmware.py --model pico-c --display ${{ matrix.display }} --firmware-directory build/standalone/pico-c/${{ matrix.display }}/firmware
          make standalone-arm-test PYTHON=python
      - name: Preserve uninstalled firmware candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pico-c-standalone-${{ matrix.display }}
          path: |
            firmware/pico-c/modified/build/standalone/pico-c/${{ matrix.display }}/firmware/*.bin
            firmware/pico-c/modified/build/standalone/pico-c/${{ matrix.display }}/firmware/*.elf
            firmware/pico-c/modified/build/standalone/pico-c/${{ matrix.display }}/firmware/*.map
            firmware/pico-c/modified/build/standalone/pico-c/${{ matrix.display }}/firmware/*.zip
            firmware/pico-c/modified/build/standalone/pico-c/${{ matrix.display }}/firmware/firmware-report.json
            firmware/pico-c/modified/firmware/web/
