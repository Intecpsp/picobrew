name: Publish verified model firmware and Hub assets
on:
  push:
    branches: [feature/machine-identity-and-hub-telemetry]
    paths: [.github/workflows/publish-machine-artifacts.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Require the triggering revision
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - name: Rebuild both product images and their browser assets
        run: |
          set -euo pipefail
          python -m pip install -r firmware/pico-s-pro/modified/requirements-test.txt
          make firmware-bootstrap PYTHON=python
          for model in pico-pro pico-s; do
            make firmware MODEL="$model" PYTHON=python
            cp "firmware/pico-s-pro/modified/build/standalone/$model/firmware/$model-standalone.bin" "firmware/pico-s-pro/modified/firmware/standalone/$model/$model-standalone.bin"
            chmod 644 "firmware/pico-s-pro/modified/firmware/standalone/$model/$model-standalone.bin"
            python firmware/pico-s-pro/modified/tools/verify_firmware_package.py --model "$model"
          done
      - name: Rebuild the committed Hub website
        run: |
          npm --prefix server/web ci --engine-strict
          npm --prefix server/web run build:bundle
      - name: Verify exact artifacts and publish the reviewed tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object firmware/pico-s-pro/modified/firmware/standalone/pico-pro/pico-pro-standalone.bin)" = 148db8a621b2d3b383064de14995d1b965e31466
          test "$(git hash-object firmware/pico-s-pro/modified/firmware/standalone/pico-s/pico-s-standalone.bin)" = bd3f02482643ca0447ce6b7f15b19927bae80cee
          test "$(git hash-object firmware/pico-s-pro/modified/firmware/web/api-explorer.js.gz)" = 7c375f120a928e3ac9befc5e8c1be3a9cef28efe
          test "$(git hash-object firmware/pico-s-pro/modified/firmware/web/app.js.gz)" = fcac2acf2dc48a9013c4627ebbe76068e9472bd5
          test "$(git hash-object firmware/pico-s-pro/modified/firmware/web/index.html.gz)" = b093ad84afdb76036541b17d9dffd3ca2fa1c881
          test "$(git hash-object server/internal/webui/bundle.zip)" = e00d891292482f855bd26bc23c37469d71dca732
          git add -- firmware/pico-s-pro/modified/firmware/standalone/pico-pro/pico-pro-standalone.bin firmware/pico-s-pro/modified/firmware/standalone/pico-s/pico-s-standalone.bin firmware/pico-s-pro/modified/firmware/web server/internal/webui
          git rm -- .github/workflows/publish-machine-artifacts.yml
          test "$(git write-tree)" = c7e20c0be1a74a1ec7aa0b7c185ae54ca3d38e67
          git restore --source=HEAD --staged --worktree .github/workflows/publish-machine-artifacts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Package verified Pico Pro, Pico S and Hub browser artifacts'
          gh auth setup-git
          git push origin HEAD:refs/heads/feature/machine-identity-and-hub-telemetry
